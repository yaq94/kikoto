name: Validate

# The job definitions shared by both validation tiers. The PR, Full, and
# Release workflows call this file and choose the tier; it has no trigger of
# its own, so a tier is always an explicit decision of the caller.
on:
  workflow_call:
    inputs:
      tier:
        description: >-
          pr selects jobs from the changed paths; full runs every job.
        required: true
        type: string

permissions:
  contents: read

jobs:
  style:
    name: Style
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      e2e: ${{ steps.plan.outputs.e2e }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      production: ${{ steps.plan.outputs.production }}
      dev_smoke: ${{ steps.plan.outputs.dev_smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go
      - name: Cache workflow lint build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('Makefile') }}
          restore-keys: actionlint-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Run style and CI policy checks
        run: make ci-style
      - name: Select required validation
        id: plan
        env:
          CI_TIER: ${{ inputs.tier }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make ci-plan

  backend:
    name: Backend (${{ matrix.check }})
    needs: style
    if: needs.style.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The race suite is serial inside each package, so it runs as slices on
        # separate runners. Slices share one compilation cache, saved by the
        # first; every other check owns its cache.
        include:
          - check: static
            target: ci-backend-static
            cache: static
            save-cache: true
          - check: coverage
            target: ci-backend-coverage
            cache: coverage
            save-cache: true
          # The 1,000-directory index contract owns a 60 s wall-clock ceiling.
          # It runs outside the race build and outside the full-suite run, so
          # the ceiling measures the writer instead of instrumentation or a
          # shared runner's load.
          - check: source-index contract
            target: source-index-contract
            cache: contract
            save-cache: true
          - check: race 1/4
            target: RACE_SHARD=1/4 backend-race-shard
            cache: race
            save-cache: true
          - check: race 2/4
            target: RACE_SHARD=2/4 backend-race-shard
            cache: race
          - check: race 3/4
            target: RACE_SHARD=3/4 backend-race-shard
            cache: race
          - check: race 4/4
            target: RACE_SHARD=4/4 backend-race-shard
            cache: race
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go
      - name: Set up Node for the test sharding script
        if: matrix.cache == 'race'
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Restore Go modules and tool dependencies
        id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', 'Makefile') }}
          restore-keys: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Restore Go compilation and lint results
        id: build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.cache }}-${{ hashFiles('backend/**/*.go', 'backend/**/*.sql', 'backend/go.mod', 'backend/go.sum', 'scripts/*.go', 'scripts/golangci-lint.yml', 'Makefile') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.cache }}-
      - name: Run backend checks
        run: make ${{ matrix.target }}
      - name: Save Go modules from one matrix job
        if: matrix.check == 'static' && steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Save Go compilation and lint results from one job per cache
        if: matrix.save-cache && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.build.outputs.cache-primary-key }}
      - name: Upload backend coverage
        if: always() && matrix.check == 'coverage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  frontend:
    name: Frontend
    needs: style
    if: needs.style.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Run frontend core checks
        run: make ci-frontend
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  e2e:
    name: E2E (${{ matrix.group }})
    needs: style
    if: needs.style.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mocked-API browser tests keep the four-way Playwright shard.
          - group: mocked-1/4
            args: --group=mocked --shard=1/4
          - group: mocked-2/4
            args: --group=mocked --shard=2/4
          - group: mocked-3/4
            args: --group=mocked --shard=3/4
          - group: mocked-4/4
            args: --group=mocked --shard=4/4
          # Ticket 19's mobile-only skeleton, shelf and cover-touch tests.
          - group: mobile-shell
            args: --group=mobile-shell
          # Fixture groups run in parallel; each owns its ports and database.
          - group: openlist
            args: --group=openlist
          - group: series
            args: --group=series
          - group: matching-shared
            args: --group=matching
          - group: personal
            args: --group=personal
          - group: source-playback
            args: --group=source-playback
          - group: content-translation
            args: --group=content-translation
          - group: integrated-acceptance
            args: --group=integrated-acceptance
          - group: translation-settings
            args: --group=translation-settings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Run browser regression group
        run: make E2E_FIXTURE_ARGS="${{ matrix.args }}" frontend-e2e-fixtures
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-e2e-artifacts-${{ strategy.job-index }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore

  smoke:
    name: Smoke
    needs: style
    if: needs.style.outputs.production == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Cache production image layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kikoto-buildx-cache
          key: docker-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', '.dockerignore', 'VERSION', 'LICENSE', 'backend/**', 'frontend/**') }}
          restore-keys: docker-${{ runner.os }}-${{ runner.arch }}-
      - name: Build production image
        run: >-
          make DOCKER_IMAGE=kikoto:ci DOCKER_BUILD="docker buildx build"
          DOCKER_BUILD_ARGS="--load --cache-from type=local,src=$RUNNER_TEMP/kikoto-buildx-cache --cache-to type=local,dest=$RUNNER_TEMP/kikoto-buildx-cache-next,mode=max"
          docker-build
      - name: Replace exported layer cache
        run: |
          rm -rf -- "$RUNNER_TEMP/kikoto-buildx-cache"
          mv -- "$RUNNER_TEMP/kikoto-buildx-cache-next" "$RUNNER_TEMP/kikoto-buildx-cache"
      - name: Exercise the production image
        run: make DOCKER_IMAGE=kikoto:ci production-e2e

  dev-smoke:
    name: Development Compose
    needs: style
    if: needs.style.outputs.dev_smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Run development Compose smoke
        run: make smoke
      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-smoke-artifacts
          path: frontend/test-results
          if-no-files-found: ignore

  android:
    name: Android build
    needs: style
    if: needs.style.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android
      - name: Run Android JVM tests and build debug APK
        run: make android-test android-build

  ios:
    name: iOS build
    needs: style
    if: needs.style.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build unsigned IPA
        run: make ios-build

  # The only result a caller or a ruleset needs: it fails unless every planned
  # job succeeded, and only the plan may authorize a skipped job.
  gate:
    name: Gate
    if: always()
    needs: [style, backend, frontend, e2e, smoke, dev-smoke, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Verify all planned validation results
        env:
          CI_PLAN: ${{ needs.style.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: make ci-results
