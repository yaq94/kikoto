name: Full

# Complete validation of one commit: every push to main, and any branch or tag
# on request from the Actions page.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      export_image:
        description: Export the tested production image for deployment
        type: boolean
        default: false

permissions:
  contents: read

# No concurrency group: every commit runs to completion beside any other run,
# so main keeps a concluded result for each of them.
jobs:
  full:
    name: Full
    uses: ./.github/workflows/validate.yml
    with:
      tier: full
      export_image: ${{ inputs.export_image == true }}
